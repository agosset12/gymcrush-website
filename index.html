<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCrush — Get fit together</title>
    <meta name="description" content="A cute, gamified fitness app for couples. Complete daily tasks, keep one shared streak, and unlock collectible companions together.">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFF8EF;
            --surface: #FFFCF7;
            --surface-soft: #FFF0E4;
            --border: #EFDCCB;
            --text: #14213A;
            --text-muted: #8F8178;
            --primary: #F66F7D;
            --primary-dark: #D94F5F;
            --accent: #EC7591;
            --mint: #7BCBB8;
            --gold: #F7C95D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(120% 80% at 50% -10%, #FFECEE 0%, rgba(255,236,238,0) 55%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 6px 18px rgba(20, 33, 58, 0.10);
            flex-shrink: 0;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-name {
            font-family: 'Rubik', sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .tagline {
            text-align: center;
            margin-top: 24px;
        }

        .tagline-line {
            font-family: 'Rubik', sans-serif;
            font-size: 44px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
            display: block;
        }

        .tagline-line.accent {
            color: var(--primary);
        }

        .subtagline {
            margin-top: 14px;
            font-size: 16px;
            color: var(--text-muted);
            max-width: 360px;
            text-align: center;
            line-height: 1.5;
        }

        .store-badge {
            margin-top: 28px;
            margin-bottom: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--text);
            color: #FFFFFF;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(20, 33, 58, 0.18);
            cursor: default;
        }

        .store-badge .apple {
            font-size: 18px;
            line-height: 1;
        }

        .store-badge .muted {
            color: #B9C0CC;
            font-weight: 500;
        }

        /* ── iPhone Carousel ── */

        .phone-section {
            margin-top: 32px;
            position: relative;
            width: 100%;
            max-width: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .carousel-column {
            flex: 1 1 auto;
            min-width: 0;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .carousel-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .carousel-btn:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(246, 111, 125, 0.18);
        }

        .screenshot-carousel {
            width: min(230px, calc(100vw - 120px));
            flex-shrink: 0;
            position: relative;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 36px;
            overflow: hidden;
            box-shadow:
                0 18px 42px rgba(20, 33, 58, 0.14),
                0 4px 12px rgba(20, 33, 58, 0.08);
        }

        .screenshot-carousel-inner {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: calc(100% * 2796 / 1290);
            overflow: hidden;
            line-height: 0;
        }

        .screenshot-track {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .screenshot-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .screenshot-slide img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center top;
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: background 0.3s, transform 0.3s;
        }

        .carousel-dot.active {
            background: var(--primary);
            transform: scale(1.25);
        }

        /* ── Footer ── */

        footer {
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
        }

        .footer-copyright {
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        /* ── Responsive ── */

        @media (max-width: 600px) {
            main {
                min-height: 100svh;
                min-height: 100dvh;
                padding: max(16px, env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
                justify-content: flex-start;
                gap: 0;
            }

            .app-icon {
                width: 56px;
                height: 56px;
                border-radius: 16px;
            }

            .brand {
                gap: 10px;
            }

            .app-name {
                font-size: 24px;
            }

            .tagline {
                margin-top: 14px;
            }

            .tagline-line {
                font-size: 30px;
            }

            .subtagline {
                font-size: 14px;
                margin-top: 10px;
            }

            .phone-section {
                margin-top: 18px;
                gap: 8px;
                max-width: 100%;
            }

            .screenshot-carousel {
                width: min(calc(100vw - 72px), 280px);
            }

            .carousel-dots {
                margin-top: 12px;
            }

            .carousel-btn {
                width: 32px;
                height: 32px;
                font-size: 15px;
            }

            .store-badge {
                margin-top: 18px;
                margin-bottom: 8px;
            }

            footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
                padding: 20px 24px calc(20px + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <div class="app-icon">
                <img src="icon.png" alt="GymCrush app icon">
            </div>
            <div class="app-name">GymCrush</div>
        </div>

        <div class="tagline">
            <span class="tagline-line">Two hearts.</span>
            <span class="tagline-line accent">One streak.</span>
        </div>

        <p class="subtagline">The cute, gamified fitness app for couples. Train together, keep one shared streak, and unlock collectible companions as you go.</p>

        <div class="phone-section">
            <button class="carousel-btn" id="prevBtn" aria-label="Previous screenshot">&#8249;</button>
            <div class="carousel-column">
                <div class="screenshot-carousel">
                    <div class="screenshot-carousel-inner">
                        <div class="screenshot-track" id="screenshotTrack">
                            <div class="screenshot-slide"><img src="screenshots/01.png" alt="GymCrush app screenshot 1"></div>
                            <div class="screenshot-slide"><img src="screenshots/02.png" alt="GymCrush app screenshot 2"></div>
                            <div class="screenshot-slide"><img src="screenshots/03.png" alt="GymCrush app screenshot 3"></div>
                            <div class="screenshot-slide"><img src="screenshots/04.png" alt="GymCrush app screenshot 4"></div>
                            <div class="screenshot-slide"><img src="screenshots/05.png" alt="GymCrush app screenshot 5"></div>
                        </div>
                    </div>
                </div>
                <div class="carousel-dots" id="carouselDots">
                    <div class="carousel-dot active"></div>
                    <div class="carousel-dot"></div>
                    <div class="carousel-dot"></div>
                    <div class="carousel-dot"></div>
                    <div class="carousel-dot"></div>
                </div>
            </div>
            <button class="carousel-btn" id="nextBtn" aria-label="Next screenshot">&#8250;</button>
        </div>

        <div class="store-badge" aria-label="Coming soon to the App Store">
            <span class="apple">&#63743;</span>
            <span>Coming soon <span class="muted">to the App Store</span></span>
        </div>
    </main>

    <footer>
        <div class="footer-copyright">&copy; 2026 GymCrush</div>
        <div class="footer-links">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="support.html">Support</a>
        </div>
    </footer>

    <script>
        (function () {
            var current = 0;
            var total = document.querySelectorAll('.screenshot-slide').length;
            var track = document.getElementById('screenshotTrack');
            var dots = document.querySelectorAll('.carousel-dot');

            function goTo(index) {
                if (index < 0) index = total - 1;
                if (index >= total) index = 0;
                current = index;
                track.style.transform = 'translateX(-' + (current * 100) + '%)';
                dots.forEach(function (dot, i) {
                    dot.classList.toggle('active', i === current);
                });
            }

            document.getElementById('prevBtn').addEventListener('click', function () {
                goTo(current - 1);
            });

            document.getElementById('nextBtn').addEventListener('click', function () {
                goTo(current + 1);
            });

            dots.forEach(function (dot, i) {
                dot.addEventListener('click', function () { goTo(i); });
            });

            var startX = 0;
            var screen = document.querySelector('.screenshot-carousel');
            screen.addEventListener('touchstart', function (e) {
                startX = e.touches[0].clientX;
            }, { passive: true });
            screen.addEventListener('touchend', function (e) {
                var diff = startX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 40) {
                    goTo(current + (diff > 0 ? 1 : -1));
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
